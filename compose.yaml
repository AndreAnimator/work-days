services:
  db:
    image: mysql:8.0
    container_name: work-days-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: code
      MYSQL_DATABASE: Ecommerce
      MYSQL_USER: user
      MYSQL_PASSWORD: code
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pcode --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: work-days-api
    restart: unless-stopped
    working_dir: /var/www/api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: Ecommerce
      DB_USERNAME: user
      DB_PASSWORD: code
      TOKEN_TTL_HOURS: 720
    ports:
      - "8000:8000"
    volumes:
      - ./api:/var/www/api


  front:
    build:
      context: ./frontend      # Caminho para a pasta onde está o frontend
      dockerfile: Dockerfile   # Nome do Dockerfile dentro dessa pasta
    container_name: meu-site-frontend
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html  # Mapeia a pasta local para hot-reload
    restart: always






volumes:
  mysql_data:

